version: "4.1"
name: f3_template
type: ARM
deviceName: STM32F302C8Tx
packDir: .pack/Keil/STM32F3xx_DFP.3.1.0
srcDirs:
  - CubeMX/Core/Src
  - CubeMX/Drivers/STM32F3xx_HAL_Driver/Src
virtualFolder:
  name: <virtual_root>
  files: []
  folders:
    - name: Bsp
      files:
        - path: User/Bsp/syscalls/syscalls.c
        - path: User/Bsp/usart_ex/usart_ex.c
        - path: User/Bsp/ads8864/ads8864.c
        - path: User/Bsp/core_delay/core_delay.c
      folders: []
    - name: Application
      files:
        - path: User/Application/Src/my_tasks.c
      folders: []
    - name: Middlewares
      files: []
      folders:
        - name: CMSIS-DSP
          files: []
          folders:
            - name: 1.16.2
              files: []
              folders:
                - name: Source
                  files:
                    - path: User/Middlewares/CMSIS-DSP/1.16.2/Source/StatisticsFunctions/arm_mean_q31.c
                  folders: []
    - name: Utils
      files:
        - path: User/Utils/ring_fifo/ring_fifo.c
      folders: []
    - name: CMSIS
      files: []
      folders:
        - name: startup
          files:
            - path: CubeMX/Drivers/CMSIS/Device/ST/STM32F3xx/Source/arm/startup_stm32f302x8.s
          folders: []
dependenceList: []
outDir: Build
miscInfo:
  uid: 5f3c9d2e8a17b604f2d94e3a1c6b08d5
targets:
  Debug:
    cppPreprocessAttrs:
      defineList:
        - STM32F302x8
        - USE_HAL_DRIVER
        - DEBUG
      incList:
        - .
        - CubeMX/Drivers/CMSIS/Include
        - CubeMX/Drivers/STM32F3xx_HAL_Driver/Inc
        - CubeMX/Drivers/CMSIS/Device/ST/STM32F3xx/Include
        - User/Bsp
        - User/Application/Inc
        - User/Utils
        - User/Middlewares/FreeRTOS/include
        - User/Middlewares/FreeRTOS/portable/GCC/ARM_CM3
        - CubeMX/Core/Inc
        - User/Middlewares/CMSIS-DSP/1.16.2/Include
      libList: []
    excludeList:
      - CubeMX/Core/Src/syscalls.c
      - CubeMX/Core/Src/sysmem.c
      - CubeMX/Core/Src/Backup
      - CubeMX/Drivers/STM32F3xx_HAL_Driver/Src/stm32f3xx_hal_i2c.c
      - CubeMX/Drivers/STM32F3xx_HAL_Driver/Src/stm32f3xx_hal_i2c_ex.c
      - <virtual_root>/Bsp/usart_ex.c
      - <virtual_root>/Bsp/dji_bldc_motor.c
      - <virtual_root>/Bsp/bsp.c
      - <virtual_root>/Middlewares/FreeRTOS
    settings:
      debugger: cortex-debug
    toolchain: AC6
    toolchainConfigMap:
      AC6:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: none
        options:
          version: 3
          afterBuildTasks: []
          asm-compiler:
            $use: asm-auto
            misc-controls: --diag_suppress=1950
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: -Wno-padded -Wno-unsafe-buffer-usage -Wno-reserved-identifier -Wno-missing-noreturn -Wno-covered-switch-default -Wno-switch-enum -Wno-missing-prototypes -Wno-newline-eof -Wno-gnu-pointer-arith -Wno-declaration-after-statement -Wno-sign-conversion -Wno-implicit-int-conversion -Wno-double-promotion -Wno-missing-field-initializers -Wno-self-assign -Wno-extra-semi-stmt -Wno-missing-variable-declarations -Wno-cast-align -Wno-implicit-float-conversion -Wno-missing-braces -Wno-cast-qual -Wno-format-nonliteral -Wno-gnu-binary-literal
            C_FLAGS: -Wno-padded -Wno-unsafe-buffer-usage -Wno-reserved-identifier -Wno-missing-noreturn -Wno-covered-switch-default -Wno-switch-enum -Wno-missing-prototypes -Wno-newline-eof -Wno-gnu-pointer-arith -Wno-declaration-after-statement -Wno-sign-conversion -Wno-implicit-int-conversion -Wno-double-promotion -Wno-missing-field-initializers -Wno-self-assign -Wno-extra-semi-stmt -Wno-missing-variable-declarations -Wno-cast-align -Wno-implicit-float-conversion -Wno-missing-braces -Wno-cast-qual -Wno-format-nonliteral -Wno-gnu-binary-literal
            language-c: c11
            language-cpp: c++11
            link-time-optimization: true
            one-elf-section-per-function: true
            optimization: level-0
            short-enums#wchar: true
            warnings: all-warnings
          global:
            output-debug-info: enable
          linker:
            misc-controls: --diag_suppress=L6329
            output-format: elf
            ro-base: "0x08000000"
            rw-base: "0x20000000"
        scatterFilePath: <YOUR_SCATTER_FILE>.sct
        storageLayout:
          RAM:
            - id: 1
              isChecked: true
              mem:
                size: "0x00004000"
                startAddr: "0x20000000"
              noInit: false
              tag: IRAM
          ROM:
            - id: 1
              isChecked: true
              isStartup: true
              mem:
                size: "0x00010000"
                startAddr: "0x08000000"
              tag: IROM
        useCustomScatterFile: false
      GCC:
        archExtensions: ""
        cpuType: Cortex-M4
        floatingPointHardware: none
        options:
          version: 5
          afterBuildTasks: []
          asm-compiler:
            ASM_FLAGS: ""
          beforeBuildTasks: []
          c/cpp-compiler:
            CXX_FLAGS: ""
            C_FLAGS: ""
            language-c: c11
            language-cpp: c++11
            one-elf-section-per-data: true
            one-elf-section-per-function: true
            optimization: level-debug
            warnings: all-warnings
          global:
            $float-abi-type: soft
            misc-control: ""
            not-use-syscalls: true
            output-debug-info: enable
            use-newlib-nano: true
          linker:
            $outputTaskExcludes:
              - .bin
            LD_FLAGS: ""
            LIB_FLAGS: -lm
            output-format: elf
            remove-unused-input-sections: true
        scatterFilePath: .\CubeMX\Drivers\CMSIS\Device\ST\STM32F3xx\Source\ld\STM32F302XX_FLASH.ld
        storageLayout:
          RAM: []
          ROM: []
        useCustomScatterFile: true
    uploadConfigMap:
      JLink:
        baseAddr: ""
        bin: ""
        cpuInfo:
          cpuName: STM32F302C8
          vendor: ST
        otherCmds: ""
        proType: 1
        speed: 8000
      STLink:
        address: "0x08000000"
        bin: ""
        elFile: None
        optionBytes: .eide/debug.st.option.bytes.ini
        otherCmds: ""
        proType: SWD
        resetMode: default
        runAfterProgram: true
        speed: 4000
    uploader: JLink
